services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: e-evkin-backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    ports:
      - "5000:5000"
    networks:
      - e-evkin-network
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: e-evkin-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - e-evkin-network
    restart: always

networks:
  e-evkin-network:
    driver: bridge
